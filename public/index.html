<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroScan - Barcode Indexer</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-auth">
    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <main class="auth-wrapper">
        <div class="auth-header-minimal">
            <svg class="auth-logo-icon" viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="5" x2="3" y2="19"></line>
                <line x1="6" y1="5" x2="6" y2="19"></line>
                <line x1="10" y1="5" x2="10" y2="19"></line>
                <line x1="14" y1="5" x2="14" y2="19"></line>
                <line x1="17" y1="5" x2="17" y2="19"></line>
                <line x1="21" y1="5" x2="21" y2="19"></line>
            </svg>
            <h1 class="auth-title">AeroScan</h1>
        </div>

        <div class="auth-card">
            <!-- Form Tabs -->
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active">Sign In</button>
                <button id="tab-create" class="tab-btn">Create Index</button>
            </div>

            <!-- Login Form -->
            <form id="form-login" class="auth-form">
                <div class="input-group">
                    <label for="login-name">Index Name</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="login-name" placeholder="Search or type name..." autocomplete="off" required>
                        <div id="login-suggestions" class="suggestions-dropdown hidden"></div>
                    </div>
                </div>
                <div class="input-group">
                    <label for="login-passcode">Passcode</label>
                    <input type="password" id="login-passcode" placeholder="Enter passcode" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Continue
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
                </button>
            </form>

            <!-- Create Form -->
            <form id="form-create" class="auth-form hidden">
                <div class="input-group">
                    <label for="create-name">New Index Name</label>
                    <input type="text" id="create-name" placeholder="e.g. storage-bin-a" required>
                    <span class="input-tip">Letters, numbers, dashes, underscores (3-30 chars).</span>
                </div>
                <div class="input-group">
                    <label for="create-passcode">Set Passcode</label>
                    <input type="password" id="create-passcode" placeholder="Choose database passcode" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Create Index
                </button>
            </form>
        </div>
    </main>

    <!-- App JavaScript (Auth logic) -->
    <script src="auth.js" defer></script>
</body>
</html>
