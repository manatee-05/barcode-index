<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroScan - Barcode Indexer</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
    <!-- html5-qrcode scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
    <!-- App JavaScript -->
    <script src="app.js" defer></script>
</head>
<body>
    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- 1. INDEX SELECTION/AUTH SCREEN -->
    <main id="auth-screen" class="container auth-container">
        <header class="auth-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="5" x2="3" y2="19"></line>
                    <line x1="6" y1="5" x2="6" y2="19"></line>
                    <line x1="10" y1="5" x2="10" y2="19"></line>
                    <line x1="14" y1="5" x2="14" y2="19"></line>
                    <line x1="17" y1="5" x2="17" y2="19"></line>
                    <line x1="21" y1="5" x2="21" y2="19"></line>
                </svg>
                <h1>Aero<span>Scan</span></h1>
            </div>
            <p class="subtitle">Index records by barcode and scanning codes</p>
        </header>

        <section class="glass-card auth-card">
            <!-- Form Tabs -->
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active">Open Index</button>
                <button id="tab-create" class="tab-btn">Create Index</button>
            </div>

            <!-- Login Form -->
            <form id="form-login" class="auth-form">
                <div class="input-group">
                    <label for="login-name">Index Name</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="login-name" placeholder="Search or type name..." autocomplete="off" required>
                        <div id="login-suggestions" class="suggestions-dropdown hidden"></div>
                    </div>
                </div>
                <div class="input-group">
                    <label for="login-passcode">Index Passcode</label>
                    <input type="password" id="login-passcode" placeholder="Enter passcode" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Open Database
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </button>
            </form>

            <!-- Create Form -->
            <form id="form-create" class="auth-form hidden">
                <div class="input-group">
                    <label for="create-name">New Index Name</label>
                    <input type="text" id="create-name" placeholder="e.g. storage-bin-a" required>
                    <span class="input-tip">Letters, numbers, dashes, underscores (3-30 chars).</span>
                </div>
                <div class="input-group">
                    <label for="create-passcode">Set Passcode</label>
                    <input type="password" id="create-passcode" placeholder="Choose database passcode" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Create Database
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
                </button>
            </form>
        </section>
    </main>

    <!-- 2. MAIN DASHBOARD SCREEN (Enforced after index unlock) -->
    <main id="dashboard-screen" class="container dashboard-container hidden">
        <!-- Navigation bar -->
        <header class="dashboard-nav">
            <div class="logo">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="5" x2="3" y2="19"></line>
                    <line x1="6" y1="5" x2="6" y2="19"></line>
                    <line x1="10" y1="5" x2="10" y2="19"></line>
                    <line x1="14" y1="5" x2="14" y2="19"></line>
                    <line x1="17" y1="5" x2="17" y2="19"></line>
                    <line x1="21" y1="5" x2="21" y2="19"></line>
                </svg>
                <h3>Aero<span>Scan</span></h3>
            </div>
            
            <div class="active-index-badge">
                <span class="dot"></span>
                <span id="display-index-name">-</span>
            </div>

            <button id="btn-logout" class="btn-icon" title="Exit index and lock">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </button>
        </header>

        <!-- Search box at the top of content list -->
        <div class="search-box">
            <div class="search-input-wrapper">
                <input type="text" id="record-search" placeholder="Search barcode, title, notes...">
                <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
        </div>

        <!-- Records scroll view -->
        <section class="records-wrapper">
            <div id="records-list" class="records-list">
                <!-- Dynamically loaded record cards -->
                <div class="list-empty">No records indexed. Scan or add manual entry below.</div>
            </div>
        </section>

        <!-- Persistent Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button id="btn-add-manual" class="nav-item">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span>Add Record</span>
            </button>
            <button id="btn-scan" class="nav-item nav-item-scan">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                <span>Scan Barcode</span>
            </button>
        </nav>
    </main>

    <!-- 3. SLIDE-UP EDITOR SHEET (Bottom Sheet layout) -->
    <div id="editor-sheet-backdrop" class="sheet-backdrop hidden"></div>
    <div id="editor-sheet" class="sheet-container hidden">
        <!-- Visual handle representing bottom sheet swipeability -->
        <div class="sheet-handle"></div>
        
        <form id="record-editor" class="record-editor">
            <div class="editor-header">
                <div>
                    <h4 id="editor-title-label">Create Record</h4>
                    <span id="editor-status-badge" class="badge">Draft</span>
                </div>
                <button type="button" id="btn-close-editor" class="btn-icon-close" aria-label="Close sheet">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <div class="sheet-body">
                <div class="input-group">
                    <label for="editor-barcode">Barcode / Value</label>
                    <input type="text" id="editor-barcode" placeholder="Scan or enter code value" required>
                </div>

                <div class="input-group">
                    <label for="editor-title">Title / Name</label>
                    <input type="text" id="editor-title" placeholder="e.g. Storage Box #14" required>
                </div>

                <div class="input-group">
                    <label for="editor-notes">Notes & Logs</label>
                    <textarea id="editor-notes" placeholder="Write location tags, contents, log entries, or notes..."></textarea>
                </div>
            </div>

            <div class="sheet-footer">
                <button type="button" id="btn-delete-record" class="btn btn-danger-outline hidden">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Delete
                </button>
                <div class="sheet-footer-right">
                    <button type="button" id="btn-cancel-edit" class="btn btn-secondary-outline">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        Save Record
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path></svg>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- 4. SCANNER MODAL -->
    <div id="scanner-modal" class="scanner-modal hidden">
        <div class="glass-card scanner-card">
            <div class="scanner-header">
                <h4>Camera Scanner</h4>
                <button id="btn-close-scanner" class="btn-icon-close" aria-label="Close scanner">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <!-- Device Selector -->
            <div class="camera-selector-container">
                <select id="camera-select" class="camera-select">
                    <option value="">Selecting camera...</option>
                </select>
            </div>

            <!-- Viewfinder Area -->
            <div class="viewfinder-container">
                <div id="scanner-viewfinder"></div>
                <div class="scanner-overlay">
                    <div class="scanner-laser"></div>
                    <div class="scanner-corners"></div>
                </div>
            </div>

            <div class="scanner-footer">
                <p>Align code inside the frame to scan automatically.</p>
            </div>
        </div>
    </div>
</body>
</html>
