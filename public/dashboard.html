<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AeroScan</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
    <!-- html5-qrcode scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
    <!-- App JavaScript -->
    <script src="dashboard.js" defer></script>
</head>
<body class="page-dashboard">
    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Navigation bar -->
    <header class="top-nav">
        <div class="nav-content">
            <div class="nav-left">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="nav-logo">
                    <line x1="3" y1="5" x2="3" y2="19"></line>
                    <line x1="6" y1="5" x2="6" y2="19"></line>
                    <line x1="10" y1="5" x2="10" y2="19"></line>
                    <line x1="14" y1="5" x2="14" y2="19"></line>
                    <line x1="17" y1="5" x2="17" y2="19"></line>
                    <line x1="21" y1="5" x2="21" y2="19"></line>
                </svg>
                <div class="index-badge">
                    <span class="status-dot"></span>
                    <span id="display-index-name">Loading...</span>
                </div>
            </div>
            <button id="btn-logout" class="btn-icon-minimal" title="Sign out">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </div>
    </header>

    <main class="dashboard-wrapper">
        <!-- Search -->
        <div class="search-section">
            <div class="search-input-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="record-search" placeholder="Search records...">
            </div>
        </div>

        <!-- Records List -->
        <div class="records-container">
            <div id="records-list" class="records-list">
                <!-- Dynamically loaded record cards -->
                <div class="list-empty">
                    <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                    <p>No records found.<br>Scan or add a new record to begin.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Persistent Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button id="btn-add-manual" class="nav-item">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Manual Add</span>
        </button>
        <button id="btn-scan" class="nav-item primary">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            <span>Scan Code</span>
        </button>
    </nav>

    <!-- SLIDE-UP EDITOR SHEET (Bottom Sheet layout) -->
    <div id="editor-sheet-backdrop" class="sheet-backdrop hidden"></div>
    <div id="editor-sheet" class="sheet-container hidden">
        <div class="sheet-handle"></div>
        
        <form id="record-editor" class="record-editor">
            <div class="editor-header">
                <div>
                    <h4 id="editor-title-label">Create Record</h4>
                    <span id="editor-status-badge" class="badge">Draft</span>
                </div>
                <button type="button" id="btn-close-editor" class="btn-icon-minimal" aria-label="Close sheet">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <div class="sheet-body">
                <div class="input-group">
                    <label for="editor-barcode">Barcode / Value</label>
                    <input type="text" id="editor-barcode" placeholder="Scan or enter code value" required>
                </div>

                <div class="input-group">
                    <label for="editor-title">Title</label>
                    <input type="text" id="editor-title" placeholder="e.g. Storage Box #14" required>
                </div>

                <div class="input-group">
                    <label for="editor-notes">Notes</label>
                    <textarea id="editor-notes" placeholder="Write tags, contents, or notes..."></textarea>
                </div>
            </div>

            <div class="sheet-footer">
                <button type="button" id="btn-delete-record" class="btn btn-danger-minimal hidden">
                    Delete
                </button>
                <div class="sheet-footer-right">
                    <button type="button" id="btn-cancel-edit" class="btn btn-secondary-minimal">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- SCANNER MODAL -->
    <div id="scanner-modal" class="scanner-modal hidden">
        <div class="scanner-card">
            <div class="scanner-header">
                <h4>Scanner</h4>
                <button id="btn-close-scanner" class="btn-icon-minimal" aria-label="Close scanner">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <!-- Device Selector -->
            <div class="camera-selector-container">
                <select id="camera-select" class="camera-select">
                    <option value="">Selecting camera...</option>
                </select>
            </div>

            <!-- Viewfinder Area -->
            <div class="viewfinder-container">
                <div id="scanner-viewfinder"></div>
                <div class="scanner-overlay">
                    <div class="scanner-laser"></div>
                    <div class="scanner-corners"></div>
                </div>
            </div>

            <div class="scanner-footer">
                <p>Align code inside the frame to scan.</p>
            </div>
        </div>
    </div>
</body>
</html>
